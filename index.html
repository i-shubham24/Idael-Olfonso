<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- German first: the main audience is in Switzerland. The page switches to English in the browser when needed. -->
    <title>Idael Alfonso | Personal Trainer in Zürich</title>
    <meta
      name="description"
      content="Persönliches Training und Ernährung mit Idael Alfonso in Zürich. Bei Ihnen zu Hause, im privaten Studio, draussen oder online. Jetzt ein kostenloses Erstgespräch buchen."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Link previews (WhatsApp, LinkedIn, iMessage, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Idael Alfonso" />
    <meta property="og:title" content="Idael Alfonso | Personal Trainer in Zürich" />
    <meta
      property="og:description"
      content="Persönliches Training und Ernährung, eins zu eins, wo immer Sie sind. Kostenloses Erstgespräch."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/media/ig/idael-zff.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1440" />
    <meta property="og:image:alt" content="Idael Alfonso am Zurich Film Festival" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Search engines: who Idael is and what he offers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Idael Alfonso Private Training",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/media/ig/idael-zff.jpg",
        "description": "Personal training and nutrition coaching in Zürich, one to one, at home, in a private studio, outdoors or online.",
        "areaServed": ["Zürich", "Zentralschweiz"],
        "address": { "@type": "PostalAddress", "addressLocality": "Zürich", "addressCountry": "CH" },
        "availableLanguage": ["de", "en", "es"],
        "sameAs": ["https://www.instagram.com/idael_fit/"],
        "founder": {
          "@type": "Person",
          "name": "Idael Alfonso",
          "jobTitle": "Personal Trainer",
          "sameAs": ["https://www.instagram.com/idael_fit/"]
        }
      }
    </script>

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://video.wixstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
